name: Lready
description: 'Lready, Inc. was the original 2007 incorporated name of Life360 — the
  family safety and location-sharing company that rebranded to Life360, Inc. in October
  2011. Life360 operates a consumer mobile platform (iOS and Android) for real-time
  family location sharing, driving safety, crash detection, roadside and emergency
  response, and is publicly traded. This profile resolves the "Lready" venture-portfolio
  lead to its operating entity, Life360, and captures the security posture the company
  exposes at its production domain. Life360 does not publish a public first-party developer
  API program or OpenAPI, so no API-surface artifacts are derived here.'
